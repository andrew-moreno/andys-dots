[ids]
*

# See 02 - Areas/Linux/Fixed Issues#Switching Ctrl+Tab and Alt+Tab Obsidian note for details

# Define the layers, but leave them empty. 
# This forces any key pressed to inherit the modifier (:C or :A).
[zen_layer:C]
[niri_layer:A]

# 1. Hold Mod, tap Tab -> Sends a precise Ctrl+Tab, then holds Ctrl
[meta]
tab = swapm(zen_layer, C-tab)

# 2. Hold Ctrl, tap Tab -> Sends a precise Alt+Tab, then holds Alt
[control]
tab = swapm(niri_layer, A-tab)

# 3. (Optional) Alt+Tab -> Behave like Meta+Tab
[alt]
tab = M-tab
